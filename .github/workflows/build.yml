# Cross-platform Electron build pipeline.
#
# Builds installers for macOS, Linux, and Windows in parallel on every push
# and PR, uploads them as workflow artifacts so anyone can grab a build
# without waiting for a release, and — when you push a tag like `v1.2.0` —
# publishes those same installers to a GitHub Release automatically.
#
# Reusing this in another Electron app? You should only need to change:
#   - the `branches` list below if your default branch isn't `main`
#   - nothing else, as long as the other app also uses `electron-builder`
#     and defines its targets in the `build` key of package.json.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# A new push to the same branch/PR cancels the in-flight run for it, so you
# never burn CI minutes building a commit nobody cares about anymore.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# contents:write is only actually exercised on tag pushes (electron-builder's
# --publish step creates/updates a GitHub Release). Harmless no-op otherwise.
permissions:
  contents: write

jobs:
  build:
    strategy:
      # One platform failing (e.g. a Linux-only packaging quirk) shouldn't
      # cancel the other two mid-build — you want all three results.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Skips cleanly if the project has no "test" script yet, instead of
      # failing on "missing script: test" — lets you drop this workflow into
      # a fresh repo before you've written any tests.
      - name: Run tests (if present)
        shell: bash
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          else
            echo "No \"test\" script in package.json — skipping."
          fi

      # electron-builder downloads Electron itself plus per-platform signing/
      # packaging tool binaries (winCodeSign, AppImage tooling, etc.) on every
      # cold run. Caching them by lockfile hash turns a ~3-5 min download into
      # a ~10s cache restore on repeat runs. Using a workspace-relative path
      # keeps it identical across macOS/Linux/Windows instead of juggling
      # three different OS cache directory conventions.
      - name: Cache Electron & electron-builder downloads
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: Build & package (${{ matrix.platform }})
        env:
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
          # No code-signing certificate is configured (see README/design.md).
          # Without this, electron-builder's macOS step tries to auto-discover
          # a signing identity in the runner's empty keychain and hard-fails.
          # This produces an unsigned build instead — fine for artifacts/
          # internal use, but add real signing before shipping to end users.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Force bash even on the Windows runner (default there is PowerShell,
        # which doesn't support the `\` line continuation used below).
        shell: bash
        run: |
          npx electron-builder --${{ matrix.platform }} \
            --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: warn
          retention-days: 14
